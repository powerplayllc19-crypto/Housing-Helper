  <script>
    // ===== APP STATE MANAGEMENT =====

    // CONFIGURATION - REPLACE WITH YOUR KEYS
    const CONFIG = {

      SUPABASE_KEY: 'your-anon-key',
      STRIPE_PUBLIC_KEY: 'pk_live_your_stripe_key',
      GEMINI_API_KEY: 'your-gemini-api-key' // Get at https://aistudio.google.com/
    };

    // ===== UTILITY FUNCTIONS =====
    const Utils = {
      formatCurrency(value) {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD'
        }).format(value);
      },
      
      formatDate(date) {
        return new Date(date).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      },
      
      saveToLocalStorage(key, data) {
        try {
          localStorage.setItem(key, JSON.stringify(data));
        } catch (e) {
          console.error('Failed to save to localStorage', e);
        }
      },
      
      getFromLocalStorage(key) {
        try {
          const data = localStorage.getItem(key);
          return data ? JSON.parse(data) : null;
        } catch (e) {
          console.error('Failed to get from localStorage', e);
          return null;
        }
      },
      
      showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `fixed top-4 right-4 px-6 py-4 rounded-lg shadow-lg text-white z-50 fade-in`;
        toast.style.background = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#0e6efb';
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }
    };

    // ===== PDF GENERATION =====
    const PDFGenerator = {
      async generateEquifaxPDF(data) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Header
        doc.setFontSize(20);
        doc.setTextColor(14, 110, 251);
        doc.text('Equifax Housing Dispute', 105, 20, { align: 'center' });
        
        // Personal Information
        doc.setFontSize(14);
        doc.setTextColor(0, 0, 0);
        doc.text('Personal Information', 20, 40);
        doc.setFontSize(11);
        doc.text(`Name: ${data.firstName} ${data.lastName}`, 20, 50);
        doc.text(`SSN: ${data.ssn}`, 20, 57);
        doc.text(`Address: ${data.currentAddress}`, 20, 64);
        doc.text(`${data.city}, ${data.state} ${data.zip}`, 20, 71);
        doc.text(`Phone: ${data.phone}`, 20, 78);
        doc.text(`Email: ${data.email}`, 20, 85);
        
        // Dispute Details
        doc.setFontSize(14);
        doc.text('Dispute Details', 20, 100);
        doc.setFontSize(11);
        doc.text(`Dispute Type: ${data.disputeType || 'General'}`, 20, 110);
        doc.text(`Reason: ${data.disputeReason || 'Not specified'}`, 20, 117);
        
        const explanation = doc.splitTextToSize(data.disputeExplanation || 'No explanation provided', 170);
        doc.text('Explanation:', 20, 124);
        doc.text(explanation, 20, 131);
        
        // Account Information
        if (data.accountNumber) {
          const yPos = 131 + (explanation.length * 7) + 10;
          doc.setFontSize(14);
          doc.text('Account Information', 20, yPos);
          doc.setFontSize(11);
          doc.text(`Account Number: ${data.accountNumber}`, 20, yPos + 10);
          if (data.creditorName) {
            doc.text(`Creditor: ${data.creditorName}`, 20, yPos + 17);
          }
        }
        
        // Footer
        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.text('Generated by POWER PLAY Housing Helper', 105, 280, { align: 'center' });
        doc.text(`Generated on ${Utils.formatDate(new Date())}`, 105, 285, { align: 'center' });
        
        doc.save('Equifax-Dispute-Form.pdf');
        Utils.showToast('PDF generated successfully!', 'success');
      },
      
      async generateMetro2PDF(data) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(20);
        doc.setTextColor(14, 110, 251);
        doc.text('METRO 2 Compliance Verification', 105, 20, { align: 'center' });
        
        doc.setFontSize(14);
        doc.setTextColor(0, 0, 0);
        doc.text('Consumer Information', 20, 40);
        doc.setFontSize(11);
        doc.text(`Name: ${data.firstName} ${data.lastName}`, 20, 50);
        doc.text(`SSN: ${data.ssn}`, 20, 57);
        doc.text(`Address: ${data.currentAddress}`, 20, 64);
        doc.text(`${data.city}, ${data.state} ${data.zip}`, 20, 71);
        
        doc.setFontSize(14);
        doc.text('Reporting Institution', 20, 90);
        doc.setFontSize(11);
        doc.text(`Institution: ${data.institutionName}`, 20, 100);
        doc.text(`METRO 2 Code: ${data.metro2Code}`, 20, 107);
        doc.text(`Report Frequency: ${data.reportFrequency}`, 20, 114);
        
        doc.setFontSize(14);
        doc.text('Account Information', 20, 130);
        doc.setFontSize(11);
        doc.text(`Account Number: ${data.accountNumber}`, 20, 140);
        doc.text(`Account Status: ${data.accountStatus}`, 20, 147);
        
        if (data.disputedFields && data.disputedFields.length > 0) {
          doc.setFontSize(14);
          doc.text('Disputed Fields', 20, 165);
          doc.setFontSize(10);
          
          let yPos = 175;
          data.disputedFields.forEach((field, idx) => {
            if (yPos > 270) {
              doc.addPage();
              yPos = 20;
            }
            doc.text(`${idx + 1}. ${field.fieldName}`, 20, yPos);
            doc.text(`   Reported: ${field.reportedValue}`, 20, yPos + 5);
            doc.text(`   Correct: ${field.correctValue}`, 20, yPos + 10);
            yPos += 20;
          });
        }
        
        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.text('Generated by POWER PLAY Housing Helper', 105, 280, { align: 'center' });
        doc.text(`Generated on ${Utils.formatDate(new Date())}`, 105, 285, { align: 'center' });
        
        doc.save('METRO2-Compliance-Form.pdf');
        Utils.showToast('PDF generated successfully!', 'success');
      },
      
      async generateBudgetPDF(budgetData) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(20);
        doc.setTextColor(14, 110, 251);
        doc.text('Budget Analysis Report', 105, 20, { align: 'center' });
        
        doc.setFontSize(14);
        doc.setTextColor(0, 0, 0);
        doc.text('Income & Expenses', 20, 40);
        doc.setFontSize(11);
        doc.text(`Monthly Income: ${Utils.formatCurrency(budgetData.income)}`, 20, 50);
        
        const totalExpenses = budgetData.expenses.reduce((sum, exp) => sum + parseFloat(exp.amount || 0), 0);
        doc.text(`Total Expenses: ${Utils.formatCurrency(totalExpenses)}`, 20, 57);
        doc.text(`Remaining: ${Utils.formatCurrency(budgetData.income - totalExpenses)}`, 20, 64);
        
        doc.setFontSize(14);
        doc.text('Expense Breakdown', 20, 80);
        doc.setFontSize(10);
        
        let yPos = 90;
        budgetData.expenses.forEach((expense, idx) => {
          if (yPos > 270) {
            doc.addPage();
            yPos = 20;
          }
          doc.text(`${expense.category}: ${Utils.formatCurrency(expense.amount)}`, 20, yPos);
          yPos += 7;
        });
        
        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.text('Generated by POWER PLAY Housing Helper', 105, 280, { align: 'center' });
        doc.text(`Generated on ${Utils.formatDate(new Date())}`, 105, 285, { align: 'center' });
        
        doc.save('Budget-Report.pdf');
        Utils.showToast('Budget PDF generated!', 'success');
      }
    };

                </h3>

                  </div>
                  <div class="flex items-center">
                    <i class="fas fa-chevron-right text-blue-500 mr-2"></i>

              <div class="card p-6 bg-gradient-to-r from-purple-50 to-blue-50">

                    <span>Fill in your information carefully</span>
                  </li>

                    <span>Review all details for accuracy</span>
                  </li>
                  <li class="flex items-start">
                    <span class="bg-blue-500 text-white rounded-full w-6 h-6 flex items-center justify-center mr-3 flex-shrink-0 mt-0.5">4</span>
                    <span>Generate and download PDF</span>
                  </li>
                  <li class="flex items-start">
                    <span class="bg-blue-500 text-white rounded-full w-6 h-6 flex items-center justify-center mr-3 flex-shrink-0 mt-0.5">5</span>

                  <i class="fas fa-calculator text-3xl text-green-500 mb-2"></i>

                <button onclick="App.navigate('resources')" class="card p-4 text-center hover:shadow-lg transition">
                  <i class="fas fa-book-open text-3xl text-purple-500 mb-2"></i>

                </button>

            </div>
          </div>
        `;
      },
      
      forms() {
        const forms = [
          {
            id: 'equifax',
            title: 'Equifax Housing Dispute',
            description: 'Dispute rental & eviction errors with Equifax',
            icon: 'fa-shield-alt',
            color: 'from-red-400 to-red-600'

          {

        return `
          <div class="content-area fade-in">
            <div class="bg-white p-6 shadow-sm mb-4">
              <h1 class="text-2xl font-bold text-gray-800">Document Generator</h1>
              <p class="text-gray-600 mt-1">Create and download your dispute forms</p>
            </div>
            
            <div class="px-4 space-y-4">
              ${forms.map(form => `
                <div class="card overflow-hidden">
                  <div class="bg-gradient-to-r ${form.color} p-4 text-white">
                    <div class="flex items-center justify-between">
                      <div class="flex items-center">

    // ===== AI SCANNER LOGIC =====
    const AIScanner = {
      async handleUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const status = document.getElementById('scanStatus');
        const results = document.getElementById('scanResults');
        const statusText = document.getElementById('statusText');
        
        status.classList.remove('hidden');
        results.classList.add('hidden');

        try {
          statusText.innerText = "AI Reading Document...";
          const { data: { text } } = await Tesseract.recognize(file, 'eng');
          
          if (CONFIG.GEMINI_API_KEY && CONFIG.GEMINI_API_KEY !== 'your-gemini-api-key') {
            statusText.innerText = "Consulting Premium AI Legal Model...";
            const aiAnalysis = await this.callGeminiAI(text);
            this.displayAIAnalysis(aiAnalysis);
          } else {
            statusText.innerText = "Running Local Analysis...";
            await new Promise(r => setTimeout(r, 800)); 
            this.processTextAndDisplay(text);
          }
        } catch (e) {
          console.error(e);
          Utils.showToast("Scan failed. Check API keys or connection.", "error");
        } finally {
          status.classList.add('hidden');
        }
      },

      async callGeminiAI(text) {
        const prompt = `Analyze this credit report text for violations of FCRA, FDCPA, or METRO 2 standards. 
        Identify specific items and provide the exact USC codes for dispute. 
        Format as a JSON array of objects with keys: type, code, law, explanation. 
        Report Text: ${text.substring(0, 5000)}`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });
        
        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text;
        // Clean JSON from markdown if present
        const jsonMatch = rawText.match(/\[.*\]/s);
        return jsonMatch ? JSON.parse(jsonMatch[0]) : [];
      },

      displayAIAnalysis(results) {
        const resultsDiv = document.getElementById('scanResults');
        resultsDiv.classList.remove('hidden');
        resultsDiv.innerHTML = `
          <div class="bg-gradient-to-r from-yellow-500 to-orange-600 text-white p-4 rounded-lg shadow-lg mb-4">
            <h3 class="font-bold flex items-center"><i class="fas fa-crown mr-2"></i> Premium AI Analysis Complete</h3>
            <p class="text-xs">Identified ${results.length} high-probability violations.</p>
          </div>
          ${results.map(v => `
            <div class="card p-4 border-l-4 border-orange-500 mb-3 bg-white">
              <div class="flex justify-between items-start">
                <h4 class="font-bold text-gray-800">${v.type}</h4>
                <span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-1 rounded font-black">${v.code}</span>
              </div>
              <p class="text-sm text-gray-600 mt-2">${v.explanation}</p>
              <button onclick="AIScanner.generateLegalDispute('${v.type}', '${v.code}', '${v.law}')" class="btn-primary mt-3 w-full py-2 text-sm bg-orange-600 border-none">
                Draft Expert ${v.law} Dispute
              </button>
            </div>
          `).join('')}
        `;
      },

      processTextAndDisplay(text) {
        const resultsDiv = document.getElementById('scanResults');
        resultsDiv.classList.remove('hidden');
        
        // Logic to extract patterns like "Late", "Charge off", "Collection"
        const foundKeywords = [];
        if (/late|past due/i.test(text)) foundKeywords.push({type: 'Late Payment', code: '15 USC 1681i', law: 'FCRA'});
        if (/collection|debt/i.test(text)) foundKeywords.push({type: 'Collection', code: '15 USC 1692g', law: 'FDCPA'});
        if (/charge.off|profit.loss/i.test(text)) foundKeywords.push({type: 'Charge-Off', code: '15 USC 1681eb', law: 'FCRA'});
        
        // Fallback if no specific pattern found
        if (foundKeywords.length === 0) {
          foundKeywords.push({type: 'Unverified Item', code: '15 USC 1681', law: 'FCRA'});
        }

        resultsDiv.innerHTML = `
          <div class="bg-indigo-900 text-white p-4 rounded-lg shadow-inner mb-4">
            <h3 class="font-bold flex items-center"><i class="fas fa-microchip mr-2"></i> AI Scan Summary</h3>
            <p class="text-xs opacity-80">Detected ${foundKeywords.length} items for high-impact dispute.</p>
          </div>
          ${foundKeywords.map(v => `
            <div class="card p-4 border-l-4 border-blue-600 mb-3 bg-white">
              <div class="flex justify-between items-start">
                <h4 class="font-bold text-gray-800">${v.type}</h4>
                <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-black">${v.code}</span>
              </div>
              <p class="text-sm text-gray-600 mt-2">Violation of ${v.law} detected. The reporting fails to meet the "Maximum Possible Accuracy" standard.</p>
              <button onclick="AIScanner.generateLegalDispute('${v.type}', '${v.code}', '${v.law}')" class="btn-primary mt-3 w-full py-2 text-sm">
                Generate ${v.law} Dispute
              </button>
            </div>
          `).join('')}
        `;
      },

      generateLegalDispute(type, code, law) {
        Utils.showToast(`Drafting ${law} Dispute...`, "success");
        AppState.currentScreen = 'form_equifax';
        App.render();
        
        setTimeout(() => {
          const area = document.querySelector('textarea[name="disputeExplanation"]');
          const reasonSelect = document.querySelector('select[name="disputeReason"]');
          
          if(reasonSelect) reasonSelect.value = "Information is not mine";
          
          if(area) {
            area.value = `DEMAND FOR REMOVAL: This ${type} is being disputed under ${law} ${code}. 
Pursuant to 15 U.S.C. § 1681i, I am demanding a complete reinvestigation of this unverified item. 
The furnisher has failed to maintain 'Maximum Possible Accuracy' as required by 15 U.S.C. § 1681e(b). 
If this item cannot be verified with the original physical signed contract within 30 days, it must be deleted immediately. 
Failure to comply will result in a formal complaint to the CFPB and potential litigation under ${law} civil liability sections.`;
          }
        }, 600);
      }
    };

    // ===== SUPABASE & STRIPE INTEGRATION =====
    const Payment = {
      async checkout() {
        Utils.showToast("Initializing Secure Payment...", "info");
        
        if (CONFIG.STRIPE_PUBLIC_KEY.includes('your_stripe')) {
          alert("Stripe Setup Required: Please add your key to the CONFIG object.");
          return;
        }

        const stripe = Stripe(CONFIG.STRIPE_PUBLIC_KEY);
        
        // This is a direct gating simulation for PWA logic
        // In production, use Supabase Edge Functions to create a real session
        Utils.showToast("Redirecting to Stripe...", "success");
        setTimeout(() => {
          AppState.isPremium = true;
          Utils.saveToLocalStorage('app_state', AppState);
          alert("DEMO MODE: Premium Access Granted. In production, this would redirect to Stripe Checkout.");
          App.render();
        }, 1500);
      },

      checkGating() {
        if (!AppState.isPremium) {
          const overlay = document.createElement('div');
          overlay.className = 'modal fade-in';

            <div class="modal-content p-8 text-center">

              <p class="text-gray-600 mb-6">Unlock the AI Scanner and Expert Metro 2 disputes for a one-time fee.</p>

            </div>
          `;

      }
    };

    const DB = {
      supabase: null,
      init() {
        if(CONFIG.SUPABASE_URL.includes('your-project')) return;
        try {
          this.supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
          console.log("Supabase Connected");
        } catch(e) {
          console.error("Supabase Connection Failed", e);
        }
      },
      async saveDispute(data) {
        if (!this.supabase) return;
        const { error } = await this.supabase.from('disputes').insert([data]);
        if (error) console.error('Error saving:', error);
      }
    };

    // ===== APP CONTROLLER =====
    const App = {
      init() {
        const saved = Utils.getFromLocalStorage('app_state');
        if (saved) {
          AppState.isPremium = saved.isPremium;
        }
        DB.init();
        this.render();
        this.registerServiceWorker();
        this.checkInstallPrompt();
      },
      
      navigate(screen) {
        AppState.currentScreen = screen;
        this.render();
        window.scrollTo(0, 0);
      },
      
      openForm(formId) {
        AppState.currentScreen = `form_${formId}`;
        this.render();
      },
      
      render() {
        const app = document.getElementById('app');
        let content = '';
        
        switch(AppState.currentScreen) {
          case 'home':
            content = Screens.home();
            break;
          case 'forms':
            content = Screens.forms();
            break;
          case 'budget':
            content = Screens.budget();
            setTimeout(() => Budget.renderChart(), 100);
            break;
          case 'resources':
            content = Screens.resources();
            break;
          case 'profile':
            content = Screens.profile();
            break;
          case 'form_equifax':
            content = FormScreens.equifax();
            break;
          case 'form_metro2':
            content = FormScreens.metro2();
            break;
          default:
            content = `<div class="p-8 text-center">
              <h2 class="text-2xl font-bold mb-4">Coming Soon</h2>
              <p class="text-gray-600 mb-4">This form is being developed</p>
              <button onclick="App.navigate('forms')" class="btn-primary">Back to Forms</button>
            </div>`;
        }
        
        app.innerHTML = content + Components.navigationBar();
      },
      
      registerServiceWorker() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed', err));
        }
      },
      
      checkInstallPrompt() {
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          
          const installPrompt = document.createElement('div');
          installPrompt.className = 'install-prompt fade-in';
          installPrompt.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="mr-4">
                <p class="font-semibold">Install POWER PLAY</p>
                <p class="text-sm text-gray-600">Access offline anytime</p>
              </div>
              <div class="flex gap-2">
                <button onclick="this.parentElement.parentElement.parentElement.remove()" class="btn-secondary px-3 py-2 text-sm">
                  Later
                </button>
                <button id="installBtn" class="btn-primary px-3 py-2 text-sm">
                  Install
                </button>
              </div>
            </div>
          `;
          document.body.appendChild(installPrompt);
          
          document.getElementById('installBtn').addEventListener('click', async () => {
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            installPrompt.remove();
          });
        });
      }
    };

    // ===== BUDGET CONTROLLER =====
    const Budget = {
      disputedFields: [],
      
      saveIncome() {
        const income = parseFloat(document.getElementById('monthlyIncome').value) || 0;
        const budget = Utils.getFromLocalStorage('budget') || { expenses: [] };
        budget.income = income;
        Utils.saveToLocalStorage('budget', budget);
        Utils.showToast('Income saved!', 'success');
        App.navigate('budget');
      },
      
      addExpense() {
        const category = document.getElementById('expenseCategory').value;
        const amount = parseFloat(document.getElementById('expenseAmount').value);
        
        if (!category || !amount) {
          Utils.showToast('Please fill in all fields', 'error');
          return;
        }
        
        const budget = Utils.getFromLocalStorage('budget') || { income: 0, expenses: [] };
        budget.expenses.push({ category, amount });
        Utils.saveToLocalStorage('budget', budget);
        Utils.showToast('Expense added!', 'success');
        
        document.getElementById('expenseCategory').value = '';
        document.getElementById('expenseAmount').value = '';
        
        App.navigate('budget');
      },
      
      removeExpense(index) {
        if (confirm('Remove this expense?')) {
          const budget = Utils.getFromLocalStorage('budget');
          budget.expenses.splice(index, 1);
          Utils.saveToLocalStorage('budget', budget);
          Utils.showToast('Expense removed', 'success');
          App.navigate('budget');
        }
      },
      
      renderChart() {
        const budget = Utils.getFromLocalStorage('budget') || { expenses: [] };
        if (budget.expenses.length === 0) return;
        
        const canvas = document.getElementById('budgetChart');
        if (!canvas) return;
        
        const ctx = canvas.getContext('2d');
        
        const categories = budget.expenses.map(e => e.category);
        const amounts = budget.expenses.map(e => e.amount);
        
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: categories,
            datasets: [{
              data: amounts,
              backgroundColor: [
                '#0e6efb', '#10b981', '#f59e0b', '#ef4444', 
                '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'
              ]
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                position: 'bottom'
              }
            }
          }
        });
      },
      
      generatePDF() {
        const budget = Utils.getFromLocalStorage('budget') || { income: 0, expenses: [] };
        PDFGenerator.generateBudgetPDF(budget);
      },
      
      reset() {
        if (confirm('Reset all budget data? This cannot be undone.')) {
          Utils.saveToLocalStorage('budget', { income: 0, expenses: [] });
          Utils.showToast('Budget reset', 'success');
          App.navigate('budget');
        }
      }
    };

    // ===== FORMS CONTROLLER =====
    const Forms = {
      disputedFields: [],
      
      submitEquifax(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);
        
        AppState.forms.equifax = data;
        PDFGenerator.generateEquifaxPDF(data);
      },
      
      submitMetro2(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);
        data.disputedFields = this.disputedFields;
        
        if (this.disputedFields.length === 0) {
          Utils.showToast('Please add at least one disputed field', 'error');
          return;
        }
        
        AppState.forms.metro2 = data;
        PDFGenerator.generateMetro2PDF(data);
      },
      
      addDisputedField() {
        const fieldName = document.getElementById('fieldName').value;
        const reportedValue = document.getElementById('reportedValue').value;
        const correctValue = document.getElementById('correctValue').value;
        
        if (!fieldName || !reportedValue || !correctValue) {
          Utils.showToast('Please fill in all field information', 'error');
          return;
        }
        
        this.disputedFields.push({ fieldName, reportedValue, correctValue });
        
        document.getElementById('fieldName').value = '';
        document.getElementById('reportedValue').value = '';
        document.getElementById('correctValue').value = '';
        
        this.renderDisputedFields();
        Utils.showToast('Field added', 'success');

      removeDisputedField(index) {
        this.disputedFields.splice(index, 1);
        this.renderDisputedFields();
      },
      
      renderDisputedFields() {
        const list = document.getElementById('disputedFieldsList');
        if (!list) return;
        
        list.innerHTML = this.disputedFields.map((field, idx) => `
          <div class="p-3 bg-purple-50 rounded-lg">
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <p class="font-semibold text-gray-800">${field.fieldName}</p>

                <p class="text-sm text-gray-600">Correct: ${field.correctValue}</p>

              <button type="button" onclick="Forms.removeDisputedField(${idx})" class="text-red-500 hover:text-red-700">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `).join('');
      }
    };

    // ===== PROFILE CONTROLLER =====

      saveProfile() {
        const profile = {
          name: document.getElementById('profileName').value,
          email: document.getElementById('profileEmail').value,
          phone: document.getElementById('profilePhone').value
        };
        
        Utils.saveToLocalStorage('userProfile', profile);
        Utils.showToast('Profile saved!', 'success');
        App.navigate('profile');
      },
      
      exportData() {
        const allData = {
          profile: Utils.getFromLocalStorage('userProfile'),
          budget: Utils.getFromLocalStorage('budget'),
          forms: AppState.forms,
          exportDate: new Date().toISOString()
        };
        
        const dataStr = JSON.stringify(allData, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = 'power-play-data.json';
        link.click();
        
        Utils.showToast('Data exported!', 'success');
      },
      
      clearData() {
        if (confirm('Clear all data? This cannot be undone.')) {
          localStorage.clear();
          AppState.forms = {};
          Utils.showToast('All data cleared', 'success');
          App.navigate('home');
        }
      }
    };

    // ===== INITIALIZE APP =====
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
